<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Tarefas</title>
</head>
<body>
    <div class="container">
        <h1>Lista de Tarefas</h1>
        <div class="saudacao" id="mensagem_saudacao">Adicione Tarefas!</div>

        <input type="text" id="nova_tarefa" placeholder="Digite sua tarefa aqui...">

        <button onclick="adicionarTarefa()">Adicionar Tarefa</button>

        <p id="mensagem"></p>

        <ul id="lista_tarefas"></ul>
        
        <!-- Botão com ID para controlar visibilidade -->
        <button id="btn_excluir_todos" onclick="excluirTodos()">Excluir Todos</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
