<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome">

        <br><br>

        <label for="senha">Senha:</label>
        <input type="text" id="senha">

        <button type="button" id="btnMostrarOcultar">
            Mostrar/Ocultar
        </button>

        <p id="mensagem" style="display:none;"></p>

        <br>

        <input type="checkbox" id="estudante">
        <label for="estudante">Sou estudante</label>

        <br><br>

        <fieldset id="dadosEstudante" hidden>
            <legend>Dados Acadêmicos</legend>

            <label for="curso">Curso:</label>
            <input type="text" id="curso">

            <br><br>

            <label for="instituicao">Instituição:</label>
            <input type="text" id="instituicao">

            <br><br>

            <label for="inicio">Período:</label>
            <input type="date" id="inicio">

            até

            <input type="date" id="fim">
        </fieldset>

        <br>

        <button type="submit">Enviar</button>

    </form>

    <script src="script.js"></script>

</body>
</html>
