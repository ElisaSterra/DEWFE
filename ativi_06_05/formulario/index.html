<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Formulário Completo</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Cadastro</h1>
        <h2>Formulário de Cadastro</h2>
    </header>

    <main>

        <!-- Formulário de Cadastro -->
        <section>

            <form id="formCadastro">

                <!-- Dados pessoais -->
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <p>Este é um formulário de fieldset.</p>

                    <label for="nome">Nome completo:</label><br>
                    <input type="text" id="nome" name="nome" required minlength="3"
                        placeholder="Seu nome">

                    <br><br>

                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required
                        placeholder="exemplo@email.com">

                    <br><br>

                    <label for="dataNascimento">Data de nascimento:</label><br>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>

                </fieldset>

                <br>

                <!-- Informações -->
                <fieldset>
                    <legend>Informações</legend>

                    <p>Gênero:</p>

                    <input type="radio" name="genero" id="masc" value="masculino">
                    <label for="masc">Masculino</label>

                    <input type="radio" name="genero" id="femi" value="feminino">
                    <label for="femi">Feminino</label>

                    <input type="radio" name="genero" id="outro" value="outro">
                    <label for="outro">Outro</label>

                    <hr>

                    <p>Interesses:</p>

                    <input type="checkbox" name="interesses" id="tecn" value="tecnologia">
                    <label for="tecn">Tecnologia</label>

                    <input type="checkbox" name="interesses" id="esp" value="esportes">
                    <label for="esp">Esportes</label>

                    <input type="checkbox" name="interesses" id="music" value="musica">
                    <label for="music">Música</label>

                    <input type="checkbox" name="interesses" id="jog" value="jogos">
                    <label for="jog">Jogos</label>

                    <hr>

                    <label for="estado">Estado:</label>

                    <br><br>

                    <select name="estado" id="estado">
                        <option value="">Selecione</option>
                        <option value="SP">SP</option>
                        <option value="RJ">RJ</option>
                        <option value="MG">MG</option>
                    </select>

                    <hr>

                    <label for="mensagem">Mensagem:</label>

                    <br><br>

                    <textarea name="mensagem" id="mensagem" rows="4" cols="30"></textarea>

                    <hr>

                    <!-- Upload -->
                    <label for="arquivo">Upload de imagem:</label>

                    <br><br>

                    <input type="file" id="arquivo" name="arquivo">

                    <br><br>

                    <!-- Botões -->
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>

                </fieldset>

            </form>

        </section>

        <!-- Resultado será exibido aqui -->
        <section>
            <h2 id="sec-resultado">Resultado</h2>
            <div id="resultado"></div>
        </section>

    </main>

    <footer>

        <p>&copy; 2026 - Formulário Turma 01 ADS</p>

        <nav aria-label="Documentações">

            <a href="https://developer.mozilla.org/pt-BR/docs/Web/HTML" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
                    alt="Documentação HTML" width="40">
            </a>

            <a href="https://developer.mozilla.org/pt-BR/docs/Web/CSS" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
                    alt="Documentação CSS" width="40">
            </a>

            <a href="https://developer.mozilla.org/pt-BR/docs/Web/JavaScript" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
                    alt="Documentação JavaScript" width="40">
            </a>

        </nav>

    </footer>

</body>

</html>
